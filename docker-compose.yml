services:
  api:
    build: .
    image: currency-exchange-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Key: ${JWT_KEY:-docker-dev-secret-key-change-me-0123456789abcdef}
      Jwt__Username: ${API_USER:-admin}
      Jwt__Password: ${API_PASSWORD:-admin123}
      Cors__Origins__0: http://localhost:4200
    volumes:
      - currency-data:/data

volumes:
  currency-data:
